# T4-1 質問への回答（SPEC F4。TASKS B26）のうち、省力化（一般型）第8回の11問（答えが資料にある8問：番1〜8、ない3問：番16〜18）。
# 質問と正解は testdata/質問/（A4 の下書き。作者の確かめ前の仮の正解）。保存した状態「質問の前」（省力化と持続化の公式資料の本文がある）を戻す。
# 合格ライン：ある15問（両方のケースを合わせて）は、内容と出典ページが正しいものが90%以上（仮）。ない5問は、すべて「書かれていない」と答え、
# 問い合わせ文の案を出す。
# 1問ずつの grader にした（問ごとの見出し「## 問<番>」の中を見る）。ある問は、正解の「見る語」がすべてあり、正解の出典のページの1つと
# 引用（「」）がある。ない問は、「書かれていない」と問い合わせ文がある。eval は全部の grader を求める（--threshold 1.0）ので、
# 90% の判定は、ある問の grader の合否から数える（作業の報告に書く）。引用がそのページにあるかは、Stop の hook が照らす（T4-2）。
