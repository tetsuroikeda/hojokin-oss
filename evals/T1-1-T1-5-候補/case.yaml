# T1-1 候補の妥当さと、T1-5 例年の公募と予算（SPEC F1。TASKS B21）。保存した状態「探す前」（会社のフォルダを作っただけ）を戻し、
# デモの会社の回答表（testdata/デモの会社/回答表.md）の事実を最初の発言に入れて、聞かずに探させる（社長役を置けないため）。
# eval の中は通信できず、Web の道具もない（DESIGN 11章・14章）。候補は、同梱の例年公募がある制度の一覧（knowledge/。
# skills/sagasu/scripts/reinen.py が出す）の公式サイトと日付から作り、確かめられなかったことを伝える形になる。
# 合格ライン（T1-1）：省力化（一般型）と持続化（通常枠）が入り、厚生労働省の助成金も1つ以上入る。3つの区分に分かれ、すべてに出典URL がある。
# 合格ライン（T1-5）：すべての候補に予算の状況（出典つき、または「見つからなかった」）が付く。「例年公募がある」候補には、
#   過去の公募の時期（直近2回以上（仮））と次の公募の見込みが付く。
# 判定は、道具に渡した候補の一覧（記録/一時/補助金の候補.json）で見る。区分・出典URL・予算の状況が欠けた候補があると、
# 道具は Word を書かない（lib/kouho.py）ので、Word ができたことも見る。
